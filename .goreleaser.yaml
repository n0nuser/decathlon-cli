version: 2

project_name: decathlon

before:
  hooks:
    - go mod tidy

builds:
  - id: decathlon
    # Under cmd/ so `go install .../cmd/decathlon` names the binary decathlon.
    main: ./cmd/decathlon
    binary: decathlon
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"

release:
  github:
    owner: n0nuser
    name: decathlon-cli
  draft: false
  prerelease: auto

