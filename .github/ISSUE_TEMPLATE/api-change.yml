name: Storefront change
description: A command exited 7 and printed a link to this form
title: "[api change] "
labels: [api-change]
body:
  - type: markdown
    attributes:
      value: |
        Most fields arrive filled in from the failed request. The CLI leaves out search terms, product refs and store ids on purpose; paste them below if they help reproduce it.
  - type: input
    id: version
    attributes:
      label: decathlon --version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Platform
  - type: input
    id: command
    attributes:
      label: Command name
  - type: input
    id: endpoint
    attributes:
      label: Page path
  - type: input
    id: status
    attributes:
      label: Status code
  - type: textarea
    id: report
    attributes:
      label: What the parser expected
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: "`decathlon doctor` output, a `--debug` run, the search or product that failed."
